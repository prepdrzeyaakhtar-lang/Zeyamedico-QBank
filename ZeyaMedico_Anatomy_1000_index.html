let filtered=[],pos=0;const state=JSON.parse(localStorage.getItem("zeyaQBankState")||"{}");
const subject=document.getElementById("subject"),topic=document.getElementById("topic"),exam=document.getElementById("exam"),mode=document.getElementById("mode");
function unique(a){return [...new Set(a)].sort()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function fill(el,vals,label){el.innerHTML='<option>All '+label+'</option>'+vals.map(v=>'<option>'+esc(v)+'</option>').join("")}
fill(subject,unique(QUESTIONS.map(q=>q.subject)),"Subjects");fill(topic,unique(QUESTIONS.map(q=>q.topic)),"Topics");
function answered(q){return state[q.id]?.answered}
function apply(){
 const s=subject.value,t=topic.value,m=mode.value;
 filtered=QUESTIONS.filter(q=>(s.startsWith("All")||q.subject===s)&&(t.startsWith("All")||q.topic===t)&&(m==="All Questions"||(m==="Unanswered"&&!answered(q))||(m==="Wrong / Revise"&&state[q.id]?.wrong)));
 pos=0;render()
}
function render(){
 document.getElementById("total").textContent=filtered.length;
 if(!filtered.length){document.getElementById("quiz").innerHTML="<h3>No questions found</h3>";return}
 const q=filtered[pos],old=state[q.id];
 document.getElementById("quiz").innerHTML='<span class="badge">'+esc(q.topic)+'</span><div class="small">Question '+(pos+1)+' of '+filtered.length+' • ID '+q.id+'</div><div class="q">'+esc(q.question)+'</div>'+
 q.options.map((o,i)=>'<button class="opt" data-i="'+i+'">'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>').join("")+
 '<div id="feedback"></div><div class="nav"><button id="prev">← Previous</button><button id="next">Next →</button></div>';
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(q,+b.dataset.i,b));
 document.getElementById("prev").onclick=()=>{if(pos>0){pos--;render()}};
 document.getElementById("next").onclick=()=>{if(pos<filtered.length-1){pos++;render()}};
 if(old?.answered)showOld(q,old);stats()
}
function answer(q,i,b){
 if(answered(q))return;const ok=String.fromCharCode(65+i)===q.answer;
 state[q.id]={answered:true,wrong:!ok};localStorage.setItem("zeyaQBankState",JSON.stringify(state));
 b.classList.add(ok?"correct":"wrong");if(!ok)document.querySelectorAll(".opt")[q.answer.charCodeAt(0)-65].classList.add("correct");
 document.getElementById("feedback").innerHTML='<div class="expl"><b>'+(ok?"✅ Correct":"❌ Incorrect")+'</b><br>'+esc(q.explanation)+'</div>';stats()
}
function showOld(q,old){document.querySelectorAll(".opt")[q.answer.charCodeAt(0)-65].classList.add("correct");document.getElementById("feedback").innerHTML='<div class="expl"><b>'+(old.wrong?"❌ Wrong / Revise":"✅ Already answered")+'</b><br>'+esc(q.explanation)+'</div>'}
function stats(){const a=Object.values(state).filter(x=>x.answered).length,w=Object.values(state).filter(x=>x.wrong).length;document.getElementById("answered").textContent=a;document.getElementById("wrong").textContent=w;document.getElementById("accuracy").textContent=a?Math.round((a-w)/a*100)+"%":"0%"}
subject.onchange=apply;topic.onchange=apply;exam.onchange=apply;mode.onchange=apply;apply();
</script></body></html>
